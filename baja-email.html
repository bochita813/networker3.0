<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Baja de contenidos · Punto Aparte</title><style>body{background:#f4efe7;color:#252321;font:16px system-ui;margin:0;padding:24px}main{max-width:550px;margin:10vh auto;background:white;padding:28px;border-radius:16px}button{background:#222;color:white;border:0;border-radius:8px;padding:13px 20px;cursor:pointer;font:inherit}button:disabled{opacity:.5}p{line-height:1.6}</style></head><body><main><small>PUNTO APARTE · HERNÁN BOCCI</small><h1>Dejar de recibir emails</h1><p>Podés cancelar tu suscripción a los contenidos de Punto Aparte. Esto no afecta tu posibilidad de conversar directamente con nosotros.</p><button id="confirm" type="button">Confirmar baja</button><p id="status" role="status"></p></main><script>(function(){const token=location.hash.slice(1),b=document.getElementById('confirm'),s=document.getElementById('status');if(!/^[0-9a-f-]{36}$/i.test(token)){b.disabled=true;s.textContent='El enlace no es válido.';return}b.onclick=async()=>{b.disabled=true;s.textContent='Procesando…';try{const r=await fetch('https://uhdkmgljczeuxzrimfaf.supabase.co/functions/v1/networker-mail-worker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'unsubscribe',token})});const j=await r.json();if(!r.ok||!j.ok)throw Error();s.textContent='Tu baja quedó registrada. No recibirás nuevas campañas por email.';history.replaceState(null,'',location.pathname)}catch(e){s.textContent='No pudimos confirmar la baja. Volvé a intentar o contactanos por WhatsApp.';b.disabled=false}}})();</script></body></html>
